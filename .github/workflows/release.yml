name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform
        shell: pwsh
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Restore and test .NET
        shell: pwsh
        run: |
          dotnet restore .\UnpackVision.slnx
          dotnet test .\UnpackVision.slnx -c Release --no-restore

      - name: Prepare Android release signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "ANDROID_KEYSTORE_BASE64 is not configured."
          }
          $keystore = Join-Path $env:RUNNER_TEMP "ecommerce-unpack-recorder.jks"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "ANDROID_KEYSTORE_PATH=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_KEYSTORE_PASSWORD=$env:KEYSTORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_KEY_ALIAS=$env:KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_KEY_PASSWORD=$env:KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure public telemetry endpoint
        shell: pwsh
        run: |
          $endpointPath = ".\src\UnpackVision.App\Assets\telemetry-endpoint.txt"
          if (-not (Test-Path -LiteralPath $endpointPath)) {
            throw "The public telemetry endpoint file is missing."
          }
          $endpoint = (Get-Content -LiteralPath $endpointPath -Raw -Encoding UTF8).Trim()
          $uri = $null
          if (-not [Uri]::TryCreate($endpoint, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -ne [Uri]::UriSchemeHttps) {
            throw "The telemetry endpoint must be an absolute HTTPS URL."
          }
          "UNPACKVISION_TELEMETRY_ENDPOINT=$endpoint" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test and build signed Android APK
        shell: pwsh
        run: |
          .\mobile\UnpackVision.Android\gradlew.bat `
            -p .\mobile\UnpackVision.Android `
            app:testDebugUnitTest app:assembleRelease `
            --no-daemon --console=plain

      - name: Download previous Velopack packages for delta updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\velopack-release | Out-Null
          gh release download `
            --repo ${{ github.repository }} `
            --pattern "releases.win.json" `
            --pattern "*.nupkg" `
            --dir .\artifacts\velopack-release `
            --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous Velopack release is available; building the initial full package."
            $global:LASTEXITCODE = 0
          }

      - name: Publish Windows application
        shell: pwsh
        run: |
          $version = "${{ steps.release_version.outputs.value }}"
          .\scripts\publish.ps1 -AppFolder "staging\$version\App"

      - name: Validate SignPath configuration
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Stable signing is enabled but SignPath configuration is missing: $($missing -join ', ')"
          }

      # Application binaries must be signed before Velopack creates the full package.
      # Signing only Setup.exe would leave the installed desktop binaries unsigned.
      - name: Upload unsigned Windows application
        id: upload_unsigned_windows_application
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-application-unsigned-${{ github.run_id }}
          path: |
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/UnpackVision.*.dll
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/拆包智录.dll
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/拆包智录.exe
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/StationHost/UnpackVision.*.dll
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/StationHost/拆包智录工位主机.dll
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/StationHost/拆包智录工位主机.exe
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/Service/UnpackVision.*.dll
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/Service/拆包智录兼容同步服务.dll
            artifacts/publish/staging/${{ steps.release_version.outputs.value }}/App/Service/拆包智录兼容同步服务.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows application with SignPath
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_windows_application.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signpath/application

      - name: Install signed Windows application outputs
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        shell: pwsh
        run: |
          $source = ".\artifacts\signpath\application"
          $destination = ".\artifacts\publish\staging\${{ steps.release_version.outputs.value }}\App"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "SignPath did not return the signed Windows application artifact."
          }
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force

      - name: Build Windows installer and release files
        shell: pwsh
        run: |
          $version = "${{ steps.release_version.outputs.value }}"
          .\scripts\package-release.ps1 `
            -Version $version `
            -SkipPublish `
            -AndroidApk .\mobile\UnpackVision.Android\app\build\outputs\apk\release\app-release.apk

      # The outer installers are signed only after packaging. The application files
      # inside them already contain the signatures produced by the preceding request.
      - name: Upload unsigned Windows installers
        id: upload_unsigned_windows_installers
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers-unsigned-${{ github.run_id }}
          path: artifacts/release-output/*Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installers with SignPath
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_windows_installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signpath/installers

      - name: Install signed Windows installer outputs
        if: ${{ vars.WINDOWS_STABLE_SIGNING_READY == 'true' }}
        shell: pwsh
        run: |
          $source = ".\artifacts\signpath\installers"
          $destination = ".\artifacts\release-output"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "SignPath did not return the signed Windows installer artifact."
          }
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force

      - name: Refresh release checksums
        shell: pwsh
        run: |
          $releaseDirectory = ".\artifacts\release-output"
          $hashLines = Get-ChildItem -LiteralPath $releaseDirectory -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $hashLines | Set-Content -LiteralPath (Join-Path $releaseDirectory 'SHA256SUMS.txt') -Encoding UTF8

      - name: Enforce Windows stable signing gate
        id: release_channel
        shell: pwsh
        env:
          WINDOWS_STABLE_SIGNING_READY: ${{ vars.WINDOWS_STABLE_SIGNING_READY }}
        run: |
          $stableRequested =
            $env:WINDOWS_STABLE_SIGNING_READY -eq "true"
          $version = "${{ steps.release_version.outputs.value }}"
          $staging = ".\artifacts\publish\staging\$version\App"
          $ownedBinaries = @(
            (Join-Path $staging "UnpackVision.Application.dll"),
            (Join-Path $staging "UnpackVision.Core.dll"),
            (Join-Path $staging "UnpackVision.Infrastructure.dll"),
            (Join-Path $staging "拆包智录.dll"),
            (Join-Path $staging "拆包智录.exe"),
            (Join-Path $staging "StationHost\UnpackVision.Application.dll"),
            (Join-Path $staging "StationHost\UnpackVision.Core.dll"),
            (Join-Path $staging "StationHost\UnpackVision.Infrastructure.dll"),
            (Join-Path $staging "StationHost\拆包智录工位主机.dll"),
            (Join-Path $staging "StationHost\拆包智录工位主机.exe"),
            (Join-Path $staging "Service\UnpackVision.Core.dll"),
            (Join-Path $staging "Service\UnpackVision.Infrastructure.dll"),
            (Join-Path $staging "Service\拆包智录兼容同步服务.dll"),
            (Join-Path $staging "Service\拆包智录兼容同步服务.exe"),
            ".\artifacts\release-output\EcommerceUnpackRecorder-win-Setup.exe",
            ".\artifacts\release-output\拆包智录-Setup.exe"
          )
          $invalid = @()
          foreach ($path in $ownedBinaries) {
            if (-not (Test-Path -LiteralPath $path)) {
              $invalid += "$path (missing)"
              continue
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              $invalid += "$path ($($signature.Status))"
            }
          }
          if ($stableRequested -and $invalid.Count -gt 0) {
            throw "Stable release refused because trusted Windows signatures are missing: $($invalid -join '; ')"
          }
          $prerelease = -not $stableRequested
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($prerelease) {
            Write-Host "Windows trusted signing is not enabled; publishing as Prerelease."
          }
          else {
            Write-Host "All owned Windows binaries are trusted; Stable release is permitted."
          }

      - name: Attest build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: artifacts/release-output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ steps.release_version.outputs.value }}.md
          files: artifacts/release-output/*
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
